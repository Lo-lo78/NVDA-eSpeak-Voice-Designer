summary = "eSpeak Voice Designer"
description = """Editor in tempo reale di voci e varianti eSpeak NG per NVDA. Permette di modificare i parametri standard di eSpeak con un'interfaccia accessibile orientata alla tastiera, inclusi pitch, formanti, consonanti, breath, tone, stress, metadati e controlli Klatt 6 / SpeechPlayer. Le varianti eSpeak di NVDA vengono caricate direttamente dal sintetizzatore e si possono caricare anche varianti personali, salvare, rinominare e cancellare le varianti personali e installare con Ctrl+Shift+S una normale variante compatibile nella cartella nativa di eSpeak di NVDA. Le macro del Designer vengono trasformate in direttive eSpeak standard, quindi i file salvati funzionano anche senza l'add-on. Include interfaccia e guida in inglese, italiano, spagnolo e francese; per le altre lingue viene usato l'inglese."""
