summary = "eSpeak Voice Designer"
description = """Diseñador en tiempo real de voces y variantes eSpeak NG para NVDA. Permite editar parámetros estándar de eSpeak mediante una interfaz accesible orientada al teclado, incluidos pitch, formantes, consonantes, breath, tone, stress, metadatos y controles Klatt 6 / SpeechPlayer. Las variantes eSpeak de NVDA se cargan directamente desde el sintetizador y también se pueden cargar variantes personales, guardar, renombrar y eliminar variantes personales e instalar con Ctrl+Mayús+S una variante estándar compatible en la carpeta nativa de variantes eSpeak de NVDA. Las macros del Designer se convierten en directivas eSpeak estándar, por lo que los archivos guardados funcionan también sin el complemento. Incluye interfaz y documentación en inglés, italiano, español y francés; otros idiomas usan inglés como alternativa."""
