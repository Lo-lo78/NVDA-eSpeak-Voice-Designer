summary = "eSpeak Voice Designer"
description = """Concepteur en temps réel de voix et variantes eSpeak NG pour NVDA. Il permet de modifier les paramètres eSpeak standard avec une interface accessible orientée clavier, notamment pitch, formants, consonnes, breath, tone, stress, métadonnées et contrôles Klatt 6 / SpeechPlayer. Les variantes eSpeak de NVDA sont chargées directement depuis le synthétiseur et les variantes personnelles peuvent également être chargées, les variantes personnelles enregistrées, renommées et supprimées, et Ctrl+Maj+S peut installer une variante standard compatible dans le dossier natif des variantes eSpeak de NVDA. Les macros du Designer sont converties en directives eSpeak standard, de sorte que les fichiers enregistrés fonctionnent également sans l'extension. Interface et documentation en anglais, italien, espagnol et français ; les autres langues utilisent l'anglais par défaut."""
