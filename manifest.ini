name = espeakVoiceDesigner
summary = "eSpeak Voice Designer"
description = """Real-time eSpeak NG voice and variant designer for NVDA. Edit standard eSpeak voice parameters through an accessible keyboard-oriented interface, including pitch, formants, consonants, breath, tone, stress, metadata and Klatt 6 / SpeechPlayer controls. NVDA/eSpeak variants are loaded directly from the active synthesizer and personal variants can be loaded, personal variants can be saved, renamed and deleted, and Ctrl+Shift+S can install a clean saved personal variant as a standard compatible variant into NVDA's native eSpeak variants folder without overwriting an existing native variant. Designer-only macros are baked into standard eSpeak directives, so saved voice files remain usable by eSpeak/NVDA without the add-on. Includes documentation and interface localization in English, Italian, Spanish and French; unsupported interface languages fall back to English."""
author = "Lo-lo"
url = None
version = 0.2.47
changelog = """0.2.47 TEST49: refines the Modified/install workflow. A freshly loaded saved personal variant is clean and can be installed immediately with Ctrl+Shift+S. Native/factory eSpeak variants and the standard voice are deliberately marked Modified and must first be saved with Ctrl+S as a personal variant. Any edit to a personal variant marks it Modified again and blocks installation until it is saved. Native installation remains non-destructive and appends a numeric suffix when a filename already exists; after installation the Designer stays on the clean personal source instead of switching to the native copy. Includes TEST48 non-destructive install, TEST47 persistent drafts and synth restoration, TEST46 Alt+E/Alt+N navigation, and TEST45 source-transparent variant fixes."""
docFileName = readme.html
minimumNVDAVersion = 2025.0.0
lastTestedNVDAVersion = 2026.1.1
